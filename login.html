{% extends "base.html" %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="JOLODHAR" onerror="this.style.display='none'">
        </div>
        <h1 class="login-title" data-i18n="login_title">Control Panel Login</h1>
        <p class="login-subtitle" data-i18n="control_subtitle">Administrative Dashboard</p>

        {% if error %}
        <div class="login-error">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="login-form">
            <div class="form-group">
                <label data-i18n="login_username">Username</label>
                <input type="text" name="username" required autofocus placeholder="admin">
            </div>
            <div class="form-group">
                <label data-i18n="login_password">Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" data-i18n="login_submit">Login</button>
        </form>

        <div class="login-hint">
            <i class="fas fa-info-circle"></i>
            <span data-i18n="login_hint">Default: admin / jolodhar2025</span>
        </div>

        <div class="login-back">
            <a href="{{ url_for('public_view') }}">
                <i class="fas fa-arrow-left"></i>
                <span data-i18n="nav_public">Public View</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
